name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build Android debug APK
        env:
          PIKACHU_APP_CLIENT_ID: ${{ vars.PIKACHU_GITHUB_APP_CLIENT_ID }}
          PIKACHU_APP_SLUG: ${{ vars.PIKACHU_GITHUB_APP_SLUG }}
        run: >-
          flutter build apk --debug
          --dart-define="GITHUB_APP_CLIENT_ID=$PIKACHU_APP_CLIENT_ID"
          --dart-define="GITHUB_APP_SLUG=$PIKACHU_APP_SLUG"
