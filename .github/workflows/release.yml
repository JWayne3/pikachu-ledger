name: Android Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'

      - name: Validate release settings
        env:
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'io.github.jwayne3.pikachuledger' }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PIKACHU_APP_CLIENT_ID: ${{ vars.PIKACHU_GITHUB_APP_CLIENT_ID }}
          PIKACHU_APP_SLUG: ${{ vars.PIKACHU_GITHUB_APP_SLUG }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo 'Missing secret ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing secret ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo 'Missing secret ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo 'Missing secret ANDROID_KEY_PASSWORD'; exit 1; }
          test -n "$PIKACHU_APP_CLIENT_ID" || { echo 'Missing repository variable PIKACHU_GITHUB_APP_CLIENT_ID'; exit 1; }
          test -n "$PIKACHU_APP_SLUG" || { echo 'Missing repository variable PIKACHU_GITHUB_APP_SLUG'; exit 1; }
          if ! printf '%s' "$ANDROID_APPLICATION_ID" | grep -Eq '^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$'; then
            echo 'ANDROID_APPLICATION_ID must be a valid reverse-domain Android package name'
            exit 1
          fi
          case "$ANDROID_APPLICATION_ID" in
            com.example|com.example.*) echo 'ANDROID_APPLICATION_ID must not use the development placeholder'; exit 1 ;;
          esac
          app_version=$(sed -n 's/^version: \([0-9.]*\)+[0-9]*$/\1/p' pubspec.yaml)
          tag_version="${GITHUB_REF_NAME#v}"
          test "$app_version" = "$tag_version" || {
            echo "pubspec.yaml version ($app_version) must match release tag ($GITHUB_REF_NAME)"
            exit 1
          }

      - name: Prepare signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pikachu-ledger-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/pikachu-ledger-release.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Resolve packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build signed release APK
        env:
          ANDROID_APPLICATION_ID: ${{ vars.ANDROID_APPLICATION_ID || 'io.github.jwayne3.pikachuledger' }}
          PIKACHU_APP_CLIENT_ID: ${{ vars.PIKACHU_GITHUB_APP_CLIENT_ID }}
          PIKACHU_APP_SLUG: ${{ vars.PIKACHU_GITHUB_APP_SLUG }}
        run: >-
          flutter build apk --release
          --dart-define="GITHUB_APP_CLIENT_ID=$PIKACHU_APP_CLIENT_ID"
          --dart-define="GITHUB_APP_SLUG=$PIKACHU_APP_SLUG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          build/app/outputs/flutter-apk/app-release.apk
          --verify-tag
          --title "$GITHUB_REF_NAME"
          --generate-notes
